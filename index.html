<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
@property --accent{syntax:'<color>';inherits:true;initial-value:#3d6bff}
:root{
  --bg:#f2f3f6;--surface:#ffffff;--text:#131a2c;--muted:#5a6479;--line:#d8dce5;
  --accent:#3d6bff;--on-accent:#ffffff;
  --display:'Oxanium','Arial Narrow',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  transition:--accent .6s ease;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d1424;--surface:#141d32;--text:#eef1f8;--muted:#9ba5bb;--line:#27314b}
}
:root[data-theme="dark"]{--bg:#0d1424;--surface:#141d32;--text:#eef1f8;--muted:#9ba5bb;--line:#27314b}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.6rem 1.2rem;flex-wrap:wrap;
  padding:.7rem clamp(1rem,4vw,2.5rem);background:color-mix(in srgb,var(--bg) 84%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.65rem;font:700 1.05rem var(--display);text-decoration:none;margin-right:auto}
.mark{display:grid;place-items:center;width:2rem;height:2rem;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.85rem;transition:background .6s}
.nav{display:flex;gap:.2rem}
.nav a{padding:.4rem .8rem;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.97rem;transition:color .2s,background .2s}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--accent);transition:transform .5s cubic-bezier(.6,0,.2,1),background .6s}
.seg[data-i="1"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:.35rem 1rem;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.93rem;transition:color .3s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--on-accent)}
.tools{display:flex;gap:.4rem}
.icon{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--text)}
.icon:hover{border-color:var(--accent)}
.icon svg{width:1.05rem;height:1.05rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{max-width:1180px;margin:0 auto;padding:clamp(1.5rem,5vw,4rem) clamp(1rem,4vw,2.5rem) 4rem;transition:opacity .16s}
main.out{opacity:0}
h2{font:700 1.7rem/1.15 var(--display);letter-spacing:-.02em;margin-bottom:1rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.2rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:600;font-size:.97rem;cursor:pointer;transition:transform .2s,border-color .2s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:.4rem .85rem;font-size:.88rem}
.empty{color:var(--muted);padding:2rem 0}

/* about */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem;align-items:end;padding-bottom:clamp(2rem,6vw,4.5rem)}
.name{font:800 clamp(3.2rem,11.5vw,9.4rem)/.9 var(--display);letter-spacing:-.045em}
.name .w{display:inline-block;white-space:nowrap;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em;margin-right:.16em}
.name .w span{display:inline-block;animation:rise .85s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
.still .name .w span{animation:none}
@keyframes rise{from{transform:translateY(105%) rotate(5deg)}}
.role{font:600 clamp(1.3rem,3vw,2rem)/1.2 var(--display);color:var(--accent);margin-top:1.4rem;min-height:1.3em;transition:color .6s}
.caret{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:3px;vertical-align:-.12em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.lede{max-width:52ch;color:var(--muted);font-size:1.15rem;margin-top:1rem}
.cta{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem}
.portrait{width:clamp(110px,17vw,210px);aspect-ratio:3/4;border-radius:999px 999px 22px 22px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font:800 clamp(2.4rem,6vw,4.6rem) var(--display);letter-spacing:-.04em;transition:background .6s}
.portrait{overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait[data-frame="arch"]{border-radius:999px 999px 22px 22px}
.portrait[data-frame="circle"]{aspect-ratio:1;border-radius:50%}
.portrait[data-frame="rounded"]{border-radius:30px}
.portrait[data-frame="square"]{aspect-ratio:1;border-radius:4px}
.portrait[data-frame="hexagon"]{aspect-ratio:1;border-radius:0;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.portrait[data-frame="blob"]{aspect-ratio:1;border-radius:62% 38% 46% 54%/55% 45% 55% 45%}
.band{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(1.5rem,5vw,4rem);padding-block:clamp(2rem,5vw,3.5rem);border-top:1px solid var(--line)}
.bio p{font-size:1.25rem;line-height:1.55;max-width:62ch}
.stats{display:grid;gap:1.1rem}
.stats div{border-left:2px solid var(--accent);padding-left:1rem;transition:border-color .6s}
.stats dd{font:800 2.6rem/1 var(--display);letter-spacing:-.03em}
.stats dt{color:var(--muted);font-size:.95rem;order:2}
.stats div{display:flex;flex-direction:column}
.skills li{display:grid;grid-template-columns:minmax(7rem,11rem) 1fr;gap:1rem;align-items:center;padding:.5rem 0}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1),background .6s}
.skills.in .bar i{width:var(--w)}
.tl{border-left:1px solid var(--line);margin-left:.4rem}
.tl li{position:relative;padding:0 0 1.6rem 1.5rem}
.tl li::before{content:"";position:absolute;left:-5px;top:.55rem;width:9px;height:9px;border-radius:50%;background:var(--accent);transition:background .6s}
.tl time{color:var(--muted);font-size:.9rem}
.tl h3{font:700 1.15rem var(--display)}
.tl .org{color:var(--accent);font-weight:600;font-size:.95rem}
.tl p+p{margin-top:.3rem;color:var(--muted);max-width:55ch}
.links{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem}
.links a{font-weight:600;text-decoration-color:var(--accent);text-underline-offset:.3em;text-decoration-thickness:2px}

/* work */
.page-h{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;justify-content:space-between}
.page-h p{color:var(--muted);max-width:50ch}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.4rem 0 2rem}
.chip{border:1px solid var(--line);background:transparent;padding:.35rem .9rem;border-radius:999px;cursor:pointer;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.row{position:relative;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 9%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){.row:hover::before{transform:scaleX(1)}.row:hover .t{transform:translateX(.6rem)}}
.rh{position:relative;display:flex;gap:1rem;align-items:center;width:100%;padding:1.3rem .5rem;background:none;border:0;text-align:left;cursor:pointer}
.t{flex:1;min-width:0;font:700 clamp(1.5rem,4vw,2.7rem)/1.05 var(--display);letter-spacing:-.025em;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tg{color:var(--muted);font-size:.92rem;text-align:right}
.pm{flex:none;position:relative;width:1rem;height:1rem;transition:transform .35s}
.pm::before,.pm::after{content:"";position:absolute;background:currentColor;left:0;right:0;top:50%;height:2px;margin-top:-1px}
.pm::after{transform:rotate(90deg)}
.row.open .pm{transform:rotate(45deg)}
.rb{position:relative;display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.row.open .rb{grid-template-rows:1fr}
.rb>div{overflow:hidden}
.rb p{max-width:62ch;padding:0 .5rem;color:var(--muted);font-size:1.08rem}
.rb a{display:inline-block;margin:.9rem .5rem 1.6rem;font-weight:600;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:.3em}
.rb p:last-child{padding-bottom:1.6rem}

/* work previews */
.rthumb{flex:none;width:6.2rem;height:3.6rem;border-radius:8px;overflow:hidden;background:#000;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.rthumb img,.rthumb video,.rthumb canvas,.pvw img,.pvw video,.pvw canvas{width:100%;height:100%;object-fit:cover;display:block}
@media (hover:hover){.row:hover .rthumb{transform:scale(1.14) rotate(-2deg)}}
.pvw{margin:0 .5rem 1.1rem;max-width:680px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}

/* commissions */
.status{display:inline-flex;align-items:center;gap:.55rem;margin:1.3rem 0 1.4rem;font-weight:600;font-size:.97rem}
.status i{width:.6rem;height:.6rem;border-radius:50%;background:#2fc9a0;box-shadow:0 0 0 4px color-mix(in srgb,#2fc9a0 25%,transparent)}
.status[data-s="limited"] i{background:#f5b83d;box-shadow:0 0 0 4px color-mix(in srgb,#f5b83d 25%,transparent)}
.status[data-s="closed"] i{background:var(--muted);box-shadow:none}
.opt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:1.2rem 2.5rem;align-items:start;padding:1.8rem 0;border-top:1px solid var(--line)}
.opt:last-child{border-bottom:1px solid var(--line)}
.opt.feat{background:color-mix(in srgb,var(--accent) 8%,transparent);padding-inline:1.3rem;border-radius:14px;border-top-color:transparent}
.opt h3{font:700 clamp(1.4rem,3vw,2rem)/1.1 var(--display);letter-spacing:-.02em;display:inline}
.badge{margin-left:.7rem;padding:.15rem .65rem;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.78rem;font-weight:600;vertical-align:.35em;white-space:nowrap}
.opt p{color:var(--muted);margin-top:.5rem;max-width:46ch}
.opt .o-time{font-size:.92rem;color:var(--text)}
.o-list li{position:relative;padding-left:1.5rem;margin:.35rem 0;font-size:.97rem}
.o-list li::before{content:"";position:absolute;left:0;top:.5em;width:.6rem;height:.32rem;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.o-side{display:grid;gap:.8rem;justify-items:end;text-align:right}
.price{font:800 clamp(1.5rem,3vw,2.2rem)/1.05 var(--display);letter-spacing:-.03em}
.reqform{display:grid;gap:.5rem;max-width:560px}
.reqform .f input[type=text],.reqform .f select,.reqform .f textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

/* code dialog, toast, goldfish */
#codeDlg{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:1rem;background:rgba(6,9,18,.6)}
.cbox{width:min(24rem,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.3rem}
.cbox h2{font-size:1.25rem;margin-bottom:.3rem}
.cbox p{color:var(--muted);font-size:.92rem;margin-bottom:.9rem}
.cbox input{width:100%;padding:.65rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:.8rem}
.crow{display:flex;gap:.5rem;flex-wrap:wrap}
.cbox #codeMsg{min-height:1.2em;margin:.7rem 0 0;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--text);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;font-weight:600;font-size:.95rem;box-shadow:0 8px 30px rgba(0,0,0,.25);white-space:nowrap}
.fish{position:fixed;left:0;bottom:22%;z-index:80;font-size:3.2rem;line-height:1;pointer-events:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.up{display:flex;gap:.5rem;align-items:center;margin:.1rem 0 .6rem}

/* 3D */
.m-wrap{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1.5rem;align-items:start;margin-top:1.6rem}
#stage{position:relative;aspect-ratio:4/3;min-height:300px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;touch-action:none}
#stage canvas{width:100%;height:100%;display:block}
.hint{position:absolute;left:1rem;bottom:.8rem;color:var(--muted);font-size:.85rem;pointer-events:none}
.mlist{display:grid;gap:.3rem}
.mlist button{display:flex;justify-content:space-between;gap:1rem;width:100%;text-align:left;padding:.65rem .9rem;background:none;border:0;border-left:3px solid var(--line);cursor:pointer;font-weight:600;transition:border-color .25s,background .25s}
.mlist button small{color:var(--muted);font-weight:400}
.mlist button[aria-pressed="true"]{border-left-color:var(--accent);background:var(--surface)}
.minfo{margin:1.2rem 0;min-height:4.5rem}
.minfo h3{font:700 1.3rem var(--display);margin-bottom:.3rem}
.minfo p{color:var(--muted);font-size:.98rem}
.toggles{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.tog{padding:.4rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.9rem}
.tog[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.sw{display:flex;gap:.5rem;align-items:center;margin-bottom:1.2rem}
.sw button{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sidenote{color:var(--muted);font-size:.85rem;margin-top:.6rem}

/* videos */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:2rem 1.5rem;margin-top:1.8rem}
.vid{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.th canvas,.th video,.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.th .dur{z-index:2}
.frames{position:absolute;inset:0}
.frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.frames img.on{opacity:1}
.dur{position:absolute;right:.7rem;bottom:.8rem;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:.1rem .5rem;border-radius:6px}
.vid h3{font:700 1.15rem var(--display);margin-top:.7rem}
.vid p{color:var(--muted);font-size:.95rem}
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1rem;background:rgba(6,9,18,.82)}
.mbox{width:min(1080px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:16px}
#mstage{aspect-ratio:16/9;background:#000;position:relative}
#mstage canvas,#mstage video,#mstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#mctl{display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem}
#mctl:empty{display:none}
#mctl input{flex:1;accent-color:var(--accent)}
#mctl .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.mbar{display:flex;gap:1rem;align-items:start;justify-content:space-between;padding:1rem 1.2rem 1.3rem}
.mbar h3{font:700 1.25rem var(--display)}
.mbar p{color:var(--muted);font-size:.97rem;margin-top:.2rem}
.wipe{position:fixed;inset:0;z-index:100;pointer-events:none;transform:translateX(-101%);background:var(--accent)}

/* editor */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(27rem,100%);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);box-shadow:-20px 0 40px rgba(0,0,0,.08)}
.editing .drawer{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.2rem .6rem}
.dh h2{font-size:1.2rem;margin:0}
.dnote{padding:0 1.2rem .8rem;color:var(--muted);font-size:.88rem}
.tabs{display:flex;gap:.3rem;padding:0 1.2rem .8rem}
.tabs button{padding:.35rem .9rem;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:.9rem}
.tabs button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.dbody{flex:1;overflow:auto;padding:0 1.2rem 1.5rem}
.grp{border-top:1px solid var(--line);padding:.2rem 0}
.grp>summary{cursor:pointer;font-weight:700;padding:.7rem 0;display:flex;justify-content:space-between}
.grp>summary small{color:var(--muted);font-weight:500}
.it{background:var(--bg);border-radius:10px;padding:0 .8rem;margin:.4rem 0}
.it>summary{cursor:pointer;padding:.6rem 0;font-weight:600;font-size:.95rem}
.it[open]{padding-bottom:.8rem}
.f{display:block;margin:.5rem 0}
.f span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:.15rem}
.f input[type=text],.f input[type=number],.f select,.f textarea{width:100%;padding:.5rem .65rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical}
.f input[type=color]{width:3rem;height:2rem;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.prim{display:flex;gap:.4rem;align-items:center}
.prim .f{flex:1;margin:.25rem 0}
.mini{padding:.3rem .75rem;font-size:.85rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.mini:hover{border-color:var(--accent)}
.mini.danger{color:#c43a3a;margin-top:.6rem}
.sub{font-size:.82rem;color:var(--muted);margin:.8rem 0 .2rem}
.dfoot{display:flex;flex-wrap:wrap;gap:.5rem;padding:.8rem 1.2rem;border-top:1px solid var(--line);align-items:center}
#json{width:100%;min-height:50vh;font:.82rem/1.5 ui-monospace,Menlo,Consolas,monospace;padding:.7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical}
#msg{font-size:.85rem;color:var(--muted);flex-basis:100%}
footer{max-width:1180px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,2.5rem) 2.5rem;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

@media (max-width:820px){
  .nav{order:5;width:100%;overflow-x:auto}
  .hero{grid-template-columns:1fr}
  .portrait{order:-1;width:104px;justify-self:start}
  .opt{grid-template-columns:1fr}
  .o-side{justify-items:start;text-align:left}
  .band{grid-template-columns:1fr}
  .m-wrap{grid-template-columns:1fr}
  .tg{display:none}
  .rthumb{width:4.6rem;height:2.7rem}
}

/* ---------- phones: compact header, tidy sections, comfortable tap targets ---------- */

  if (reduced) { ctl.autoRotate = false; $('#t-rot').setAttribute('aria-pressed', 'false'); }

  const ro = new ResizeObserver(() => { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); });
  ro.observe(stage);
  let raf = 0; const loop = () => { raf = requestAnimationFrame(loop); ctl.update(); renderer.render(scene, cam); };
  loop();
  show(Math.min(selModel, p.models.length - 1));
  cleanups.push(() => { cancelAnimationFrame(raf); ro.disconnect(); if (model) disposeObj(model); floor.geometry.dispose(); floor.material.dispose(); ctl.dispose(); renderer.dispose(); renderer.domElement.remove(); });
}

/* ============================ theme ============================ */
(function () {
  try { const t = localStorage.getItem('portfolio-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
  $('#themeBtn').onclick = () => {
    const d = document.documentElement, dark = d.dataset.theme ? d.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    d.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('portfolio-theme', d.dataset.theme); } catch (e) { }
  };
})();

/* ============================ editor ============================ */
const ENUMS = { shape: ['knot', 'torus', 'ico', 'sphere', 'cube', 'cone', 'octa', 'dodeca'], style: ['waves', 'orbits', 'grid'], frame: ['arch', 'circle', 'rounded', 'square', 'hexagon', 'blob'], commissionStatus: ['open', 'limited', 'closed'], featured: ['no', 'yes'], enabled: ['on', 'off'] };
const RANGE = { level: [0, 100], opacity: [0, 100], speed: [0, 100], density: [0, 100], lines: [3, 24] };
const LONG = new Set(['bio', 'description', 'text', 'tagline', 'commissionIntro']);
const LABELS = { roles: 'Rotating titles', avatar: 'Portrait text (1 to 2 letters)', accent: 'Accent color', tagline: 'Intro line', bio: 'About text', link: 'Link', src: 'Video file or link (blank = animated demo)', file: '3D file path (.glb), for example models/lamp.glb. Overrides Shape.', duration: 'Length in seconds', level: 'Level (0 to 100)', tags: 'Tags', shape: 'Shape', style: 'Demo style', projects: 'Projects (Work page)', models: '3D models (3D page)', videos: 'Videos (Videos page)', stats: 'Numbers (About page)', skills: 'Skills (About page)', experience: 'Experience (About page)', links: 'Social links (About page)', email: 'Email', location: 'Location', url: 'Link', org: 'Organization', period: 'When', photo: 'Photo: file path or address (or upload below)', frame: 'Photo frame shape', preview: 'Preview image or video: path, address or upload. Use demo:waves, demo:orbits or demo:grid for an animated placeholder.', commissionIntro: 'Commissions intro text', commissionStatus: 'Availability', commissions: 'Commission options (Commissions page)', price: 'Price', time: 'Turnaround', features: 'What is included', featured: 'Highlight as most requested?', enabled: 'Show animated background', dotColor: 'Dot color', opacity: 'Opacity (0 = invisible, 100 = solid)', speed: 'Animation speed (0 = still)', density: 'Dot density (0 to 100)', lines: 'Number of contour lines (3 to 24)' };
const lab = k => LABELS[k] || (k.charAt(0).toUpperCase() + k.slice(1));
const TPL = { roles: '', tags: '', features: '', commissions: { title: 'New option', price: 'From $100', time: '1 week', description: '', features: [''], featured: 'no' }, links: { label: '', url: 'https://' }, skills: { name: '', level: 70 }, stats: { value: '', label: '' }, experience: { period: '', title: '', org: '', text: '' }, projects: { title: 'New project', description: '', preview: '', tags: [], link: '' }, models: { title: 'New model', description: '', file: 'models/your-model.glb', shape: 'knot', color: '#3d6bff' }, videos: { title: 'New video', description: '', style: 'waves', color: '#f0457a', duration: 12, src: '' } };
const drawer = $('#drawer'), dbody = $('#dbody');
let drawerOpen = false, tab = 'form', openPath = '', editPid = null, unlockedPid = null;   // the editor only ever works on unlockedPid

function field(v, path, key, showLabel = true) {
  const P = `data-path="${esc(path)}"`; let c;
  const isData = (key === 'photo' || key === 'preview') && /^data:/.test(v || '');
  if (isData) c = '<p class="sidenote" style="margin:.2rem 0">An uploaded image is set.</p>';
  else if (ENUMS[key]) c = `<select ${P}>${ENUMS[key].map(o => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
  else if (typeof v === 'number') c = `<input type="number" ${P} data-num value="${v}" ${RANGE[key] ? `min="${RANGE[key][0]}" max="${RANGE[key][1]}"` : ''}>`;
  else if ((key === 'color' || key === 'accent' || key === 'dotColor') && /^#[0-9a-f]{6}$/i.test(v)) c = `<input type="color" ${P} value="${v}">`;
  else if (LONG.has(key)) c = `<textarea rows="3" ${P}>${esc(v)}</textarea>`;
  else c = `<input type="text" ${P} value="${esc(v)}">`;
  const up = (key === 'photo' || key === 'preview') ? `<div class="up"><label class="mini file">Upload image<input type="file" accept="image/*" data-upload="${esc(path)}" data-max="${key === 'photo' ? 640 : 1100}"></label>${/^data:/.test(v || '') ? `<button type="button" class="mini" data-act="clear" data-path="${esc(path)}">Remove</button>` : ''}</div>` : '';
  return `<label class="f">${showLabel ? `<span>${esc(lab(key))}</span>` : ''}${c}</label>${up}`;
}
function node(v, path, key) {
  if (Array.isArray(v)) {
    return v.map((x, i) => {
      const p = path + '.' + i;
      if (x && typeof x === 'object') {
        const head = x.title || x.name || x.label || x.period || x.value || ('Item ' + (i + 1));
        return `<details class="it"${p === openPath ? ' open' : ''}><summary>${esc(String(head))}</summary>${Object.keys(x).filter(k => k[0] !== '_').map(k => node(x[k], p + '.' + k, k)).join('')}<button type="button" class="mini danger" data-act="del" data-path="${esc(p)}">Remove this item</button></details>`;
      }
      return `<div class="prim">${field(x, p, key, false)}<button type="button" class="mini" data-act="del" data-path="${esc(p)}" aria-label="Remove">x</button></div>`;
    }).join('') + `<button type="button" class="mini" data-act="add" data-path="${esc(path)}">Add ${key === 'tags' ? 'tag' : key === 'roles' ? 'title' : 'item'}</button>`;
  }
  return field(v, path, key);
}
function formHTML(pid) {
  const p = data[pid];
  const scal = ['name', 'avatar', 'photo', 'frame', 'accent', 'location', 'email', 'tagline', 'bio'];
  let html = `<details class="grp" open><summary>Profile</summary>${scal.map(k => node(p[k], pid + '.' + k, k)).join('')}<div class="sub">${lab('roles')}</div>${node(p.roles, pid + '.roles', 'roles')}<div class="sub">Your secret code</div><p class="sidenote">This code opens the editor for ${esc(p.name || 'this profile')} only. Type a new one, or tap "Make one for me". Then tap "Set code", and "Download my file" to keep it.</p><div class="prim"><input type="text" id="newCode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="New secret code"><button type="button" class="mini" id="makeCode">Make one for me</button></div><div class="prim" style="margin-top:.5rem"><button type="button" class="mini" id="setCode">Set code</button><button type="button" class="mini" id="dlJson">Download my file</button></div></details>`;
  html += `<details class="grp"><summary>Animated background</summary>${['enabled', 'dotColor', 'opacity', 'speed', 'density', 'lines'].map(k => field(p.background[k], pid + '.background.' + k, k)).join('')}<p class="sidenote">Drifting dotted contour lines behind the page. Each person has their own.</p></details>`;
  html += ['stats', 'skills', 'experience', 'links', 'projects', 'models', 'videos', 'commissions'].map(g => `<details class="grp"${openPath.startsWith(pid + '.' + g + '.') ? ' open' : ''}><summary>${esc(lab(g))}<small>${p[g].length}</small></summary>${g === 'commissions' ? node(p.commissionStatus, pid + '.commissionStatus', 'commissionStatus') + node(p.commissionIntro, pid + '.commissionIntro', 'commissionIntro') : ''}${node(p[g], pid + '.' + g, g)}</details>`).join('');
  return html;
}
function renderDrawerNote() { if (!editPid) return; $('#dnote').textContent = tab === 'form' ? `Editing ${data[editPid].name || 'this profile'} only. Changes are saved in this browser. Download ${FILES[editPid]} to make them permanent.` : ''; }
function renderDrawer() {
  renderDrawerNote();
  const pt = $('#ptabs'); pt.hidden = true; pt.innerHTML = '';   // no person switcher: the editor is locked to the unlocked profile
  if (!editPid) { dbody.innerHTML = ''; return; }
  drawer.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  if (tab === 'form') dbody.innerHTML = formHTML(editPid);
  else dbody.innerHTML = `<p class="sidenote" style="margin:0 0 .6rem">${esc(srcNote(editPid))} This is the content for ${esc(data[editPid].name || 'this person')} only, including the background settings. To make your edits permanent, download ${esc(FILES[editPid])} (or copy this text into it) and put it next to index.html in your repo.</p><textarea id="json" spellcheck="false">${esc(JSON.stringify(data[editPid], stripSession, 2))}</textarea><div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem"><button type="button" class="mini" id="applyJson">Apply</button><button type="button" class="mini" id="dlJson">Download ${esc(FILES[editPid])}</button><button type="button" class="mini" id="copyJson">Copy</button><label class="mini file" style="position:relative">Load .json file<input type="file" id="jfile" accept=".json,application/json"></label></div>`;
}
function setDrawer(open, pid) {
  if (open && !IDS.includes(pid)) return;
  unlockedPid = open ? pid : null; editPid = unlockedPid; openPath = '';
  drawerOpen = open; document.body.classList.toggle('editing', open); drawer.inert = !open;
  if (open) { renderDrawer(); $('#dclose').focus(); } else { renderDrawer(); $('#codeBtn').focus(); }   // closing locks the editor and empties it
}
$('#codeBtn').onclick = openCode;
$('#dclose').onclick = () => setDrawer(false);
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!codeDlg.hidden) closeCode(); else if (!modal.hidden) closeVideo(); else if (drawerOpen) setDrawer(false); } });

let rT; const schedRender = () => { clearTimeout(rT); rT = setTimeout(() => render({ intro: false }), 300); };
const msg = t => { $('#msg').textContent = t; clearTimeout(msg.t); msg.t = setTimeout(() => $('#msg').textContent = '', 3500); };
drawer.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newCode') { e.preventDefault(); $('#setCode').click(); } });
drawer.addEventListener('input', e => {
  const t = e.target, path = t.dataset && t.dataset.path; if (!path || !unlockedPid || pidOf(path) !== unlockedPid) return;
  setAt(path, t.dataset.num !== undefined ? (parseFloat(t.value) || 0) : t.value);
  save(pidOf(path)); schedRender();
});
drawer.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; renderDrawer(); return; }
  if (!unlockedPid || editPid !== unlockedPid) return;
  const b = e.target.closest('[data-act]');
  if (b) {
    const path = b.dataset.path; if (pidOf(path) !== unlockedPid) return;
    if (b.dataset.act === 'add') {
      const arr = getAt(path), tpl = TPL[path.split('.').pop()];
      arr.push(tpl && typeof tpl === 'object' ? clone(tpl) : (tpl ?? ''));
      openPath = path + '.' + (arr.length - 1);
    } else if (b.dataset.act === 'clear') {
      setAt(path, '');
    } else {
      const i = path.lastIndexOf('.'); getAt(path.slice(0, i)).splice(+path.slice(i + 1), 1); openPath = '';
    }
    save(pidOf(path)); renderDrawer(); render({ intro: false }); return;
  }
  if (e.target.id === 'makeCode') {
    const pick = () => CODE_WORDS[crypto.getRandomValues(new Uint32Array(1))[0] % CODE_WORDS.length];
    $('#newCode').value = pick() + '-' + pick() + '-' + pick(); $('#newCode').focus(); msg('Here is a code. Tap "Set code" to use it.'); return;
  }
  if (e.target.id === 'setCode') {
    const k = $('#newCode').value.trim().toLowerCase(), other = IDS.find(id => id !== editPid);
    if (k.length < 6) { msg('Too short. Use at least 6 letters.'); return; }
    if (Object.hasOwn(CODES, k) || codeOk(other, k)) { msg('Please pick a different code.'); return; }
    const salt = [...crypto.getRandomValues(new Uint8Array(8))].map(v => v.toString(16).padStart(2, '0')).join('');
    data[editPid].editorCode = { salt, hash: sha256(salt + ':' + k) };
    save(editPid); $('#newCode').value = ''; msg('Code saved. Now tap "Download my file".'); return;
  }
  if (e.target.id === 'applyJson') {
    try {
      const obj = JSON.parse($('#json').value);
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('Needs a single profile object');
      if (obj.a && obj.b && !obj.name) throw new Error('This looks like the old combined file. Paste only one person');
      data[editPid] = obj; normalize(data); save(editPid); renderDrawer(); render({ intro: false }); msg('Applied.');
    }
    catch (err) { msg('Could not apply: ' + err.message); }
  }
  if (e.target.id === 'dlJson') {
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data[editPid], stripSession, 2)], { type: 'application/json' })); a.download = FILES[editPid];
      document.body.append(a); a.click(); a.remove(); msg('Downloaded. Put it next to index.html and push it to GitHub.');
    } catch (err) { msg('Download did not work here. Use Copy instead.'); }
  }
  if (e.target.id === 'copyJson') {
    const ta = $('#json'); ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => msg('Copied.'), () => { try { document.execCommand('copy'); msg('Copied.'); } catch (x) { msg('Press Ctrl+C to copy the selected text.'); } });
  }
});
drawer.addEventListener('change', e => {
  const up = e.target.dataset && e.target.dataset.upload;
  if (up) {
    if (!unlockedPid || pidOf(up) !== unlockedPid) return;
    const uf = e.target.files[0];
    if (uf) readImage(uf, +e.target.dataset.max || 800).then(url => { setAt(up, url); save(pidOf(up)); renderDrawer(); render({ intro: false }); }).catch(() => msg('That image could not be read.'));
    return;
  }
  if (e.target.id !== 'jfile' || !unlockedPid) return; const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { $('#json').value = t; msg('File loaded. Press Apply to use it.'); });
});
let resetArm = 0;
$('#resetBtn').onclick = e => {
  if (!unlockedPid) return;
  if (!resetArm) { e.target.textContent = 'Click again to confirm'; resetArm = setTimeout(() => { resetArm = 0; e.target.textContent = 'Discard edits for this person'; }, 3000); return; }
  clearTimeout(resetArm); resetArm = 0; e.target.textContent = 'Discard edits for this person';
  data[editPid] = clone(base[editPid].data); normalize(data); SRC[editPid] = base[editPid].hash === 'defaults' ? 'defaults' : 'file'; try { localStorage.removeItem(keyOf(editPid)); } catch (x) { } openPath = ''; renderDrawer(); render({ intro: false }); msg('Edits discarded.');
};

/* ============================ start ============================ */
function loadPerson(id) {
  return fetch(FILES[id], { cache: 'no-cache' })
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(txt => { const j = JSON.parse(txt); data[id] = j; normalize(data); base[id] = { data: clone(data[id]), hash: djb(txt) }; SRC[id] = 'file'; })
    .catch(() => { })          // falls back to the built-in sample for this person if their file is missing
    .then(() => {
      try { const s = JSON.parse(localStorage.getItem(keyOf(id)) || 'null'); if (s && s.base === base[id].hash && s.data) { data[id] = s.data; normalize(data); SRC[id] = 'draft'; } } catch (e) { }
    });
}
Promise.all(IDS.map(loadPerson)).then(() => {
  if (!location.hash) history.replaceState(null, '', '#a/about');
  go(true);
});
